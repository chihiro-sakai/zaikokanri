<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>在庫管理｜研修用クリニック</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="demo-note">研修用・架空6品目／共有保存／外部送信なし。参加者全員で同じ在庫を確認します。</div>
  <header><div class="brand"><div class="brand-mark">▱</div><div><h1>在庫管理</h1><p>研修用クリニック</p></div></div></header>
  <nav class="tabs" aria-label="機能">
    <button data-tab="inventory" class="active">◇ 在庫一覧</button>
    <button data-tab="orders">▣ 発注リスト <b id="order-badge">0</b></button>
    <button data-tab="tally">−＋ 使った・棚卸し</button>
    <button data-tab="master">✎ 品目マスタ</button>
    <button data-tab="purchase">￥ 仕入集計</button>
    <button data-tab="settings">♧ 通知設定</button>
  </nav>
  <main>
    <section class="toolbar"><input id="search" type="search" placeholder="品目名で検索"><div class="legend"><span class="red">●</span> 基準割れ（要発注） <span class="yellow">●</span> 残りわずか <span class="green">●</span> 十分</div></section>
    <div id="message" role="status" aria-live="polite"></div>
    <section id="screen"></section>
  </main>
  <dialog id="reset-dialog"><form method="dialog"><h2>講師用リセット</h2><p>共有在庫と操作履歴を初期値へ戻します。</p><input id="reset-token" type="password" placeholder="リセットコード"><div class="dialog-actions"><button value="cancel" class="secondary">キャンセル</button><button id="reset-confirm" value="default" class="danger">初期値へ戻す</button></div></form></dialog>
</body>
</html>
